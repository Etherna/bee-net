                      oneOf:
                        - type: string
                          pattern: ^[A-Fa-f0-9]{64}$
                          example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
                        - type: string
                          pattern: ^[A-Fa-f0-9]{128}$
                          example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f2d2810619d29b5dbefd5d74abce25d58b81b251baddb9c3871cf0d6967deaae2
        "500": *a2
        default:
          description: Default response
  /pins/check:
    get:
      summary: Validate pinned chunks integrity
      description: >
        Returns a stream of newline-delimited JSON objects (NDJSON), one per
        pinned reference checked.

        The response uses chunked transfer encoding; clients should parse each line as an independent

        `PinIntegrityResponse` object rather than buffering the body into a single JSON value.
      tags:
        - Pinning
      parameters:
        - in: query
          name: ref
          schema: *a33
          required: false
          description: Optional reference to check; if not provided, all pinned references
            are checked
      responses:
        "200":
          description: NDJSON stream of integrity results, one object per line
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    oneOf:
                      - type: string
                        pattern: ^[A-Fa-f0-9]{64}$
                        example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
                      - type: string
                        pattern: ^[A-Fa-f0-9]{128}$
                        example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f2d2810619d29b5dbefd5d74abce25d58b81b251baddb9c3871cf0d6967deaae2
                  total:
                    type: integer
                  missing:
                    type: integer
                  invalid:
                    type: integer
        "500": *a2
        default:
          description: Default response
  "/pss/send/{topic}/{targets}":
    post:
