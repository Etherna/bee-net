                      - type: string
                        pattern: ^[A-Fa-f0-9]{128}$
                        example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f2d2810619d29b5dbefd5d74abce25d58b81b251baddb9c3871cf0d6967deaae2
        "400": *a11
        "404": *a17
        "500": *a2
        default:
