  "/soc/{owner}/{id}":
    post:
      summary: Upload a Single Owner Chunk
      tags:
        - Single owner chunk
      parameters:
        - in: path
          name: owner
          schema:
            &a38
            type: string
            pattern: ^[A-Fa-f0-9]{40}$
            example: 36b7efd913ca4cf880b8eeac5093fa27b0825906
          required: true
          description: Ethereum address of the chunk owner
        - in: path
          name: id
          schema:
            &a36
            type: string
            pattern: ^([A-Fa-f0-9]+)$
            example: cf880b8eeac5093fa27b0825906c600685
          required: true
          description: Unique identifier for the chunk
        - in: query
          name: sig
          schema: *a36
          required: true
          description: Signature
        - in: header
          name: swarm-postage-batch-id
          schema: *a5
          required: false
          description: ID of the postage batch to use. Either this or
            `swarm-postage-stamp` must be supplied.
        - *a37
        - *a6
        - *a7
        - *a8
        - *a18
        - *a4
      requestBody:
        required: true
        description: The SOC binary data, composed of the span (8 bytes) and up to 4KB
          of payload.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: *a19
          headers:
            swarm-tag:
              description: Tag UID, returned when an upload session is in use (either because
                `swarm-tag` was supplied, `swarm-deferred-upload` requested
                deferred mode, or `swarm-pin` was set).
              schema: *a21
            swarm-act-history-address: *a24
        "400": *a11
        "401":
          &a39
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  reasons:
                    type: array
                    nullable: true
                    description: List of reasons for the error message.
                    items:
                      type: string
        "402": *a20
        "404": *a17
        "500": *a2
        default:
          description: Default response
    get:
      summary: Retrieve Single Owner Chunk data
      tags:
        - Single owner chunk
      parameters:
        - in: path
          name: owner
          schema: *a38
          required: true
          description: Ethereum address of the Owner of the SOC
        - in: path
          name: id
          schema: *a36
          required: true
          description: Unique identifier for the chunk data
        - &a41
          in: header
          name: swarm-only-root-chunk
          schema:
            type: boolean
          required: false
          description: Returns only the root chunk of the content
        - *a25
        - *a26
        - *a27
        - *a28
      responses:
        "200":
          description: Related Single Owner Chunk data
          headers:
            swarm-soc-signature:
              &a42
              description: Attached digital signature of the Single Owner Chunk
              schema:
                type: string
                pattern: ^([A-Fa-f0-9]+)$
                example: cf880b8eeac5093fa27b0825906c600685
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400": *a11
        "401": *a39
        "500": *a2
        default:
          description: Default response
  "/feeds/{owner}/{topic}":
