openapi: 3.0.3
info:
  version: 8.1.0
  title: Bee API
  description: API endpoints for interacting with the Swarm network, supporting
    file operations, messaging, and node management
externalDocs:
  description: Browse the documentation at the Swarm Docs
  url: https://docs.ethswarm.org
servers:
  - url: http://{apiRoot}:{port}/v1
    variables:
      apiRoot:
        default: localhost
        description: Base address of the local bee node main API
      port:
        default: "1633"
        description: Service port provided in bee node config
  - url: http://{apiRoot}:{port}
    variables:
      apiRoot:
        default: localhost
        description: Base address of the local bee node main API
      port:
        default: "1633"
        description: Service port provided in bee node config
paths:
  /grantee:
    post:
      summary: Create a grantee list
      tags:
        - ACT
      parameters:
        - in: header
          schema:
            &a5
            in: header
            name: swarm-postage-batch-id
            description: ID of Postage Batch that is used to upload data with
            schema:
              type: string
              pattern: ^[A-Fa-f0-9]{64}$
              example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
          name: swarm-postage-batch-id
          required: true
        - in: header
          schema:
            &a6
            in: header
            name: swarm-tag
            schema:
              &a12
              type: integer
              format: uint64
            description: Associate upload with an existing Tag UID
          name: swarm-tag
          required: false
        - in: header
          schema:
            &a7
            in: header
            name: swarm-pin
            schema:
              type: boolean
            description: >
              Indicates whether the uploaded data should also be locally pinned
              on this node
          name: swarm-pin
          required: false
        - in: header
          schema:
            &a8
            in: header
            name: swarm-deferred-upload
            schema:
              type: boolean
              default: "true"
            description: >
              Indicates whether the uploaded data should be sent to the network
              immediately or deferred. Default: deferred (true)
          name: swarm-deferred-upload
          required: false
        - in: header
          schema:
            &a4
            in: header
            name: swarm-act-history-address
            schema:
              type: string
              pattern: ^[A-Fa-f0-9]{64}$
              example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
            description: ACT history reference address
          name: swarm-act-history-address
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grantees:
                  type: array
                  items:
                    type: string
                    pattern: ^[A-Fa-f0-9]{66}$
                    example: 02ab7473879005929d10ce7d4f626412dad9fe56b0a6622038931d26bd79abf0a4
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                &a10
                type: object
                properties:
                  ref:
                    &a1
                    type: string
                    pattern: ^[A-Fa-f0-9]{128}$
                    example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f2d2810619d29b5dbefd5d74abce25d58b81b251baddb9c3871cf0d6967deaae2
                  historyref: *a1
        "400":
          &a11
          description: Bad request
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  reasons:
                    type: array
                    nullable: true
                    description: List of reasons for the error message.
                    items:
                      type: string
        "500":
          &a2
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  reasons:
                    type: array
                    nullable: true
                    description: List of reasons for the error message.
                    items:
                      type: string
  "/grantee/{address}":
    get:
      summary: Get the grantee list
      tags:
        - ACT
      parameters:
        - in: path
          name: address
          schema:
            &a3
            type: string
            pattern: ^[A-Fa-f0-9]{128}$
            example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f2d2810619d29b5dbefd5d74abce25d58b81b251baddb9c3871cf0d6967deaae2
          required: true
          description: Grantee list reference
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  pattern: ^[A-Fa-f0-9]{66}$
                  example: 02ab7473879005929d10ce7d4f626412dad9fe56b0a6622038931d26bd79abf0a4
        "404":
          &a17
          description: Not Found
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  reasons:
                    type: array
                    nullable: true
                    description: List of reasons for the error message.
                    items:
                      type: string
        "500": *a2
    patch:
      summary: Update the grantee list
      description: Add or remove grantees from an existing grantee list
      tags:
        - ACT
      parameters:
        - in: path
          name: address
          schema: *a3
          required: true
          description: Grantee list reference
        - in: header
          schema: *a4
          name: swarm-act-history-address
          required: true
        - in: header
          schema: *a5
          name: swarm-postage-batch-id
          required: true
        - in: header
          schema: *a6
          name: swarm-tag
          required: false
        - in: header
          schema: *a7
          name: swarm-pin
          required: false
        - in: header
          schema: *a8
          name: swarm-deferred-upload
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add:
                  type: array
                  items:
                    &a9
                    type: string
                    pattern: ^[A-Fa-f0-9]{66}$
                    example: 02ab7473879005929d10ce7d4f626412dad9fe56b0a6622038931d26bd79abf0a4
                  description: List of grantees to add
                revoke:
                  type: array
                  items: *a9
                  description: List of grantees to revoke future access from
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: *a10
        "400": *a11
        "500": *a2
  /bytes:
    post:
      summary: Upload data
      tags:
        - Bytes
      parameters:
        - *a5
        - *a6
        - *a7
        - *a8
        - &a22
          in: header
          name: swarm-encrypt
          schema:
            type: boolean
          description: |
            Indicates whether the file should be encrypted
        - &a13
          in: header
          name: swarm-redundancy-level
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
              - 4
          description: >
            Add redundancy to the data being uploaded so that downloaders can
            download it with better UX. 0 value is default and does not add any
            redundancy to the file.
        - &a18
          in: header
          name: swarm-act
          schema:
            type: boolean
            default: "false"
          required: false
          description: Determines if the uploaded data should be treated as ACT content
        - *a4
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: OK
          headers:
            swarm-tag:
              &a23
              description: Tag UID
              schema: *a12
          content:
            application/json:
              schema:
                &a19
                type: object
                properties:
                  reference:
                    oneOf:
                      - type: string
                        pattern: ^[A-Fa-f0-9]{64}$
                        example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
                      - type: string
                        pattern: ^[A-Fa-f0-9]{128}$
                        example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f2d2810619d29b5dbefd5d74abce25d58b81b251baddb9c3871cf0d6967deaae2
                      - type: string
                        pattern: ^[A-Za-z0-9]+\.[A-Za-z0-9]+$
                        example: swarm.eth
        "400": *a11
        "402":
          &a20
          description: Payment Required
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  reasons:
                    type: array
                    nullable: true
                    description: List of reasons for the error message.
                    items:
                      type: string
        "500": *a2
        default:
          description: Default response
  "/bytes/{address}":
    get:
      summary: Retrieve data by reference
      tags:
        - Bytes
      parameters:
        - in: path
          name: address
          schema:
            &a14
            oneOf:
              - type: string
                pattern: ^[A-Fa-f0-9]{64}$
                example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
              - type: string
                pattern: ^[A-Fa-f0-9]{128}$
                example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f2d2810619d29b5dbefd5d74abce25d58b81b251baddb9c3871cf0d6967deaae2
              - type: string
                pattern: ^[A-Za-z0-9]+\.[A-Za-z0-9]+$
                example: swarm.eth
          required: true
          description: Swarm address reference to content
        - &a25
          in: header
          name: swarm-cache
          schema:
            type: boolean
            default: "true"
          required: false
          description: "Indicates whether downloaded data should be cached on the node.
            Default: cached (true)"
        - &a26
          in: header
          name: swarm-redundancy-strategy
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
          required: false
          description: >
            Specify the retrieval strategy for redundant data. Values represent:
            NONE (0), DATA (1), PROX (2), RACE (3). NONE: no prefetching. DATA:
            prefetch only data chunks. PROX: prefetch chunks near this node.
            RACE: prefetch all chunks and use the first n to arrive. Multiple
            strategies can be cascaded if fallback mode is enabled. Default:
            NONE > DATA > PROX > RACE
        - &a27
          in: header
          name: swarm-redundancy-fallback-mode
          schema:
            type: boolean
          required: false
          description: >
            Specify if the retrieve strategies (chunk prefetching on redundant
            data) are used in a fallback cascade. The default is true.
        - *a13
        - &a28
          in: header
          name: swarm-chunk-retrieval-timeout
          schema:
            description: Time duration in Go time.Duration format (e.g., 5.0018ms)
            type: string
            example: 5.0018ms
          required: false
          description: |
            Specify the timeout for chunk retrieval. The default is 30 seconds.
        - &a29
          in: header
          name: swarm-lookahead-buffer-size
          schema:
            type: integer
          required: false
          description: >
            Override the lookahead buffer size used during retrieval, in bytes.
            When unset the node picks 8x or 16x the io.Copy default buffer (32
            kB) depending on file size.
        - &a15
          in: header
          name: swarm-act-timestamp
          schema:
            type: integer
            format: int64
          required: false
          description: ACT history Unix timestamp
        - &a16
          in: header
          name: swarm-act-publisher
          schema:
            type: string
            pattern: ^[A-Fa-f0-9]{66}$
            example: 02ab7473879005929d10ce7d4f626412dad9fe56b0a6622038931d26bd79abf0a4
          required: false
          description: ACT content publisher's public key
        - *a4
      responses:
        "200":
          description: Retrieved content specified by reference
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400": *a11
        default:
          description: Default response
    head:
      summary: Retrieve headers containing the content type and length for the reference
      tags:
        - Bytes
      parameters:
        - in: path
          name: reference
          schema: *a14
          required: true
          description: Swarm address reference to content
        - *a15
        - *a16
        - *a4
      responses:
        "200":
          description: The chunk exists.
          headers:
            Content-Type:
              description: The MIME type of the resource (e.g., application/octet-stream).
              schema:
                type: string
                example: application/octet-stream
            Content-Length:
              description: The size of the chunk in bytes.
              schema:
                type: integer
                example: 1024
            Access-Control-Expose-Headers:
              description: Headers exposed for CORS.
              schema:
                type: string
                example: Accept-Ranges, Content-Encoding
        "400": *a11
        "404": *a17
        default:
          description: Default response
  /chunks:
    post:
      summary: Upload a chunk
      tags:
        - Chunk
      parameters:
        - *a6
        - in: header
          name: swarm-postage-batch-id
          schema: *a5
          required: false
        - &a37
          in: header
          name: swarm-postage-stamp
          description: |
            Postage stamp for the corresponding chunk in the request. \
            It is required if Swarm-Postage-Batch-Id header is missing \
            It consists of: \
            - batch ID - 0:32 bytes \
            - postage index (bucket and bucket index) - 32:40 bytes \
            - timestamp - 40:48 bytes \
            - signature - 48:113 bytes
          schema:
            type: string
            pattern: ^([A-Fa-f0-9]+)$
            example: cf880b8eeac5093fa27b0825906c600685
        - *a18
        - *a4
      requestBody:
        description: Chunk binary data containing at least 8 bytes.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: OK
          headers:
            swarm-tag:
              description: Tag UID from the request `swarm-tag` header if provided.
              schema:
                &a21
                type: integer
                format: uint64
            swarm-act-history-address:
              &a24
              description: Swarm address reference to the new ACT history entry
              schema:
                type: string
                pattern: ^[A-Fa-f0-9]{64}$
                example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
              required: false
          content:
            application/json:
              schema: *a19
        "400": *a11
        "402": *a20
        "500": *a2
        default:
          description: Default response
  /chunks/stream:
    get:
      summary: Stream chunks for upload
      description: Establishes a WebSocket connection for streaming chunks. Each
        uploaded chunk receives a binary acknowledgment (`0`). Chunks are sent
        as binary messages. When a tag is specified, chunks are stored locally
        and uploaded to the network after the stream closes. Without a tag,
        chunks are directly uploaded to the network as they arrive.
      tags:
        - Chunk
      parameters:
        - *a6
        - in: query
          name: swarm-tag
          schema: *a21
          required: false
          description: Associate upload with an existing Tag UID (use when WebSocket
            client cannot set custom headers)
        - in: header
          name: swarm-postage-batch-id
          description: ID of Postage Batch that is used to upload data with. Optional when
            chunks include pre-signed postage stamps.
          required: false
          schema:
            &a35
            type: string
            pattern: ^[A-Fa-f0-9]{64}$
            example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
      responses:
        "200":
          description: Connection established
        "400": *a11
        default:
          description: Default response
  /bzz:
    post:
      summary: Upload a file or collection of files
      description: "Upload single files or collections of files. For a single file,
        `Content-Type` is optional: when present it is stored as metadata as-is;
        when absent the server infers a type from the start of the body. To
        upload a collection, send a multipart request with files in the form
        data with appropriate headers. Tar files can be uploaded with the
        `swarm-collection` header to extract and upload the directory structure.
        Without the `swarm-collection` header, requests are treated as single
        file uploads. Multipart requests are always treated as collections; use
        the `swarm-index-document` header to specify a single file to serve."
      tags:
        - BZZ
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: Filename when uploading single file
        - *a6
        - *a7
        - *a22
        - in: header
          name: Content-Type
          schema:
            type: string
          description: "Single file: trimmed Content-Type is stored as-is or, if omitted
            or empty, inferred from the first bytes without validating against
            the body; tar (`swarm-collection`) and multipart collection uploads
            still need a full-body Content-Type (e.g. `application/x-tar` or
            `multipart/form-data` with boundary) so the request can be parsed."
        - in: header
          name: swarm-collection
          schema:
            type: boolean
          required: false
          description: Upload file/files as a collection
        - in: header
          name: swarm-index-document
          schema:
            type: string
            example: index.html
          required: false
          description: Default file to serve when a directory path is accessed
        - in: header
          name: swarm-error-document
          schema:
            type: string
            example: error.html
          required: false
          description: Custom error document to return when a path is not found in the
            collection
        - *a5
        - *a8
        - *a13
        - *a18
        - *a4
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/x-tar:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: OK
          headers:
            swarm-tag: *a23
            etag:
              description: >
                The RFC7232 ETag header field in a response provides the current
                entity-

                tag for the selected resource. An entity-tag is an opaque identifier for

                different versions of a resource over time, regardless whether multiple

                versions are valid at the same time. An entity-tag consists of an opaque

                quoted string, possibly prefixed by a weakness indicator.
              schema:
                type: string
            swarm-act-history-address: *a24
          content:
            application/json:
              schema: *a19
        "400": *a11
        "402": *a20
        "500": *a2
        default:
          description: Default response
  "/bzz/{address}/":
    get:
      summary: Retrieve a file or index document from a collection
      tags:
        - BZZ
      parameters:
        - in: path
          name: address
          schema: *a14
          required: true
          description: Swarm address of content
        - *a25
        - *a26
        - *a27
        - *a13
        - *a28
        - *a29
        - *a15
        - *a16
        - *a4
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            swarm-feed-resolved-version:
              &a30
              schema:
                type: string
              required: false
              description: Indicates which feed version was resolved (v1 or v2)
        "400": *a11
        "404": *a17
        "500": *a2
        default:
          description: Default response
    head:
      summary: Retrieve headers with content type and length for the reference
      tags:
        - BZZ
      parameters:
        - in: path
          name: reference
          schema: *a14
          required: true
          description: Swarm address of content
        - *a15
        - *a16
        - *a4
        - *a26
        - *a27
        - *a13
      responses:
        "200":
          description: Chunk exists
        "400": *a11
        "404": *a17
        default:
          description: Default response
  "/bzz/{address}/{path}":
    get:
      summary: Retrieve a file from a collection by path
      tags:
        - BZZ
      parameters:
        - in: path
          name: address
          schema: *a14
          required: true
          description: Swarm address of content
        - in: path
          name: path
          schema:
            type: string
          required: true
          description: Path to the file in the collection.
        - *a26
        - *a27
        - *a13
        - *a28
        - *a13
        - *a25
        - *a29
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            swarm-feed-resolved-version: *a30
        "400": *a11
        "404": *a17
        "500": *a2
        default:
          description: Default response
    head:
      summary: Get the headers containing the content type and length for the reference
      tags:
        - BZZ
      parameters:
        - in: path
          name: reference
          schema: *a14
          required: true
          description: Swarm address of content
        - in: path
          name: path
          schema:
            type: string
          required: true
          description: Path to the file in the collection.
        - *a26
        - *a27
        - *a13
      responses:
        "200":
          description: Chunk exists
        "400": *a11
        "404": *a17
        default:
          description: Default response
  /tags:
    get:
      summary: Get list of tags
      tags:
        - Tag
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
          required: false
          description: The number of items to skip before starting to collect the result
            set.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          required: false
          description: The numbers of items to return.
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        uid:
                          type: integer
                          format: uint64
                        address:
                          type: string
                          pattern: ^[A-Fa-f0-9]{64}$
                          example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
                        startedAt:
                          type: string
                          format: date-time
                          example: 2020-06-11T11:26:42.6969797+02:00
                        split:
                          type: integer
                          description: Number of chunks created by the splitter.
                        seen:
                          type: integer
                          description: Number of chunks that are already uploaded with same reference and
                            same postage batch. These don't need to be synced
                            again.
                        stored:
                          type: integer
                          description: Number of chunks that were stored locally as they lie in the
                            uploader node's neighborhood. This is only
                            applicable for full nodes.
                        sent:
                          type: integer
                          description: Number of chunks sent on the network to peers as a part of the
                            upload. Chunks could be sent multiple times because
                            of failures or replication.
                        synced:
                          type: integer
                          description: Number of chunks that were pushed with a valid receipt. The receipt
                            will also show if they were stored at the correct
                            depth.
        "500": *a2
        default:
          description: Default response
    post:
      summary: Create Tag
      tags:
        - Tag
      description: Tags can be thought of as upload sessions which can be tracked
        using the tags endpoint. It will keep track of the chunks that are
        uploaded as part of the tag and will push them out to the network once a
        done split is called on the Tag. This happens internally if you use the
        `Swarm-Deferred-Upload` header.
      responses:
        "201":
          description: New Tag Info
          content:
            application/json:
              schema:
                &a31
                type: object
                properties:
                  uid:
                    type: integer
                    format: uint64
                  address:
                    type: string
                    pattern: ^[A-Fa-f0-9]{64}$
                    example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
                  startedAt:
                    type: string
                    format: date-time
                    example: 2020-06-11T11:26:42.6969797+02:00
                  split:
                    type: integer
                    description: Number of chunks created by the splitter.
                  seen:
                    type: integer
                    description: Number of chunks that are already uploaded with same reference and
                      same postage batch. These don't need to be synced again.
                  stored:
                    type: integer
                    description: Number of chunks that were stored locally as they lie in the
                      uploader node's neighborhood. This is only applicable for
                      full nodes.
                  sent:
                    type: integer
                    description: Number of chunks sent on the network to peers as a part of the
                      upload. Chunks could be sent multiple times because of
                      failures or replication.
                  synced:
                    type: integer
                    description: Number of chunks that were pushed with a valid receipt. The receipt
                      will also show if they were stored at the correct depth.
        "500": *a2
        default:
          description: Default response
