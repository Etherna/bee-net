  /stamps:
    get:
      summary: Get postage stamps for this node
      tags:
        - Postage Stamps
      responses:
        "200":
          description: An array of postage stamps
          content:
            application/json:
              schema:
                type: object
                properties:
                  stamps:
                    type: array
                    nullable: false
                    items:
                      anyOf:
                        - type: object
                          properties:
                            batchID:
                              &a71
                              type: string
                              pattern: ^[A-Fa-f0-9]{64}$
                              example: 36b7efd913ca4cf880b8eeac5093fa27b0825906c600685b6abdd6566e6cfe8f
                            utilization:
                              type: integer
                              description: >
                                Raw batch fullness indicator: the highest write
                                count among the `2^bucketDepth` collision
                                buckets of the batch. This is **not** a
                                percentage; one unit corresponds to one chunk
                                written into the fullest bucket. Total batch
                                capacity is `2^depth` chunks, while the fullest
                                bucket caps at `2^(depth - bucketDepth)` chunks,
                                so the fractional usage of the batch is
                                `utilization / 2^(depth - bucketDepth)` (also
                                exposed directly as `utilizationRatio`). When
                                the value reaches `2^(depth - bucketDepth)` the
                                batch is effectively full and any further write
                                to the fullest bucket would overflow it.
                            utilizationRatio:
                              type: number
                              format: double
                              minimum: 0
                              maximum: 1
                              description: >
                                Fractional batch fullness in the range `[0, 1]`,
                                computed as `utilization / 2^(depth -
                                bucketDepth)`. A value of `1` means the fullest
                                bucket has reached its capacity and the batch
                                can no longer accept writes that would land in
                                that bucket.
                            usable:
                              description: Indicates whether the batch was discovered by the Bee node and has
                                received sufficient on-chain confirmations
                              type: boolean
                            label:
                              type: string
                            depth:
                              type: integer
                            amount:
                              description: Numeric string representing an integer that may exceed
                                `Number.MAX_SAFE_INTEGER` (2^53-1)
                              type: string
                              example: "1000000000000000000"
                            bucketDepth:
                              type: integer
                            blockNumber:
                              type: integer
                              format: int64
                            immutableFlag:
                              type: boolean
                            exists:
                              type: boolean
                            batchTTL:
                              type: integer
                              format: int64
                        - type: object
                          properties:
                            batchID: *a71
                            exists:
                              type: boolean
                            batchTTL:
