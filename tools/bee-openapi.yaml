      tags:
        - Feed
      parameters:
        - in: path
          name: owner
          schema: *a38
          required: true
          description: Ethereum address of the feed owner
        - in: path
          name: topic
          schema: *a36
          required: true
          description: Topic identifier for the feed
        - in: query
          name: at
          schema:
            type: integer
            format: int64
          required: false
          description: "Timestamp of the update (default: now)"
        - in: query
          name: after
          schema:
            type: integer
            format: uint64
          required: false
          description: "Start index (default: 0)"
        - in: query
          name: type
          schema: *a40
          required: false
          description: "Feed indexing scheme (default: sequence)"
        - *a41
        - *a25
        - *a26
        - *a27
        - *a28
      responses:
        "200":
          description: Latest feed update
          headers:
            swarm-soc-signature: *a42
            swarm-feed-index:
              description: The index of the found update
              schema:
                type: string
                pattern: ^([A-Fa-f0-9]+)$
                example: cf880b8eeac5093fa27b0825906c600685
            swarm-feed-index-next:
              description: The index of the next possible update
              schema:
                type: string
                pattern: ^([A-Fa-f0-9]+)$
                example: cf880b8eeac5093fa27b0825906c600685
            swarm-feed-resolved-version: *a30
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400": *a11
        "401": *a39
        "500": *a2
        default:
          description: Default response
